  "components": {
    "schemas": {
      "APIError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "code",
          "message",
          "request_id",
          "retryable"
        ],
        "additionalProperties": false
      },
      "Meta": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "edition": {
            "type": "string",
            "enum": [
              "hosted",
              "self-hosted"
            ]
          },
          "development": {
            "type": "boolean"
          },
          "fixture_auth": {
            "type": "boolean"
          },
          "bootstrap_required": {
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "version",
          "edition",
          "development",
          "fixture_auth"
        ],
        "additionalProperties": false
      },
      "Health": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ],
        "additionalProperties": false
      },
      "Role": {
        "type": "string",
        "enum": [
          "owner",
          "admin",
          "maintainer",
          "reviewer",
          "viewer"
        ]
      },
      "Capability": {
        "type": "object",
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "supported",
              "unsupported",
              "unknown"
            ]
          },
          "scope": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "last_checked": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "state",
          "scope",
          "reason",
          "source",
          "version",
          "last_checked"
        ],
        "additionalProperties": false
      },
      "Organisation": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "paused": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "name",
          "version",
          "paused"
        ],
        "additionalProperties": false
      },
      "Membership": {
        "type": "object",
        "properties": {
          "org_id": {
            "type": "string"
          },
          "role": {
            "$ref": "#/components/schemas/Role"
          },
          "team_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "repository_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "all_repositories": {
            "type": "boolean"
          },
          "user_id": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "org_id",
          "role",
          "team_ids",
          "repository_ids",
          "all_repositories"
        ],
        "additionalProperties": false
      },
      "Session": {
        "type": "object",
        "properties": {
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "email": {
                "type": "string"
              }
            },
            "required": [
              "id",
              "name",
              "email"
            ],
            "additionalProperties": false
          },
          "organisations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Organisation"
            }
          },
          "memberships": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Membership"
