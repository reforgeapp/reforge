        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "org_id": {
            "type": "string"
          },
          "connection_id": {
            "type": "string"
          },
          "native_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "url": {
            "type": "string"
          },
          "provider": {
            "type": "string",
            "enum": [
              "github",
              "gitlab",
              "gitea"
            ]
          },
          "default_branch": {
            "type": "string"
          },
          "archived": {
            "type": "boolean"
          },
          "paused": {
            "type": "boolean"
          },
          "accessible": {
            "type": "boolean"
          },
          "team_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "last_synced_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "id",
          "org_id",
          "connection_id",
          "native_id",
          "name",
          "url",
          "provider",
          "default_branch",
          "archived",
          "paused",
          "accessible",
          "team_ids",
          "last_synced_at",
          "version"
        ],
        "additionalProperties": false
      },
      "RepositoryPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Repository"
            }
          },
          "next_cursor": {
            "type": "string"
          },
          "complete": {
            "type": "boolean"
