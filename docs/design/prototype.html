<html lang="en">
<head>

<title>Reforge · Design prototype</title>
<style>
:root{--slate:#172535;--slate-2:#23364a;--ink:#1f2d3d;--muted:#6b7b8d;--line:#dfe6ec;--paper:#fff;--wash:#f3f6f8;--teal:#087f7a;--teal-2:#dff3f1;--amber:#9b6500;--amber-2:#fff2d6;--red:#b63b39;--red-2:#fde9e8;--green:#1d7d4e;--green-2:#e3f5eb;--shadow:0 10px 30px #18304612}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:var(--slate);color:#d9e4ee;padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 26px;color:#fff}.mark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:grid;place-items:center;font-weight:800}.brand strong{font-size:20px;letter-spacing:-.03em}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8da2b6;font-weight:700}.nav{display:grid;gap:4px}.nav button{border:0;border-radius:8px;background:transparent;color:#bac9d7;text-align:left;padding:10px 12px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:var(--slate-2);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.nav .icon{width:18px;text-align:center;color:#7f9bb1}.scope{margin-top:auto;border-top:1px solid #ffffff18;padding:16px 12px 0;color:#abc0d1;font-size:12px}.scope b{display:block;color:#fff;margin:4px 0}.main{min-width:0}.topbar{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.top-title{display:flex;align-items:center;gap:12px}.top-title h1{font-size:18px;margin:0;letter-spacing:-.02em}.synthetic{border:1px solid #e7bd63;background:#fff8e8;color:#865600;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}.top-actions{display:flex;align-items:center;gap:10px}.org{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;color:var(--ink)}.search{width:230px;border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:#fbfcfd}.content{padding:28px 30px 42px;max-width:1500px}.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.view-head h2{font-size:25px;letter-spacing:-.035em;margin:0 0 4px}.view-head p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--ink);padding:8px 12px;font-weight:650}.btn:hover{border-color:#9db2c0}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{background:transparent}.btn:disabled{cursor:not-allowed;opacity:.52}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:20px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.stat{padding:16px}.stat .number{font-size:27px;font-weight:750;margin:5px 0}.stat small{color:var(--muted)}.stat.teal{border-top:3px solid var(--teal)}.stat.amber{border-top:3px solid #d39825}.stat.red{border-top:3px solid var(--red)}.stat.green{border-top:3px solid var(--green)}.cols{grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr)}.card{padding:18px}.card h3{font-size:15px;margin:0 0 14px}.card h3 span{float:right;font-size:12px;color:var(--muted);font-weight:500}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;color:#758697;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:12px 10px;border-bottom:1px solid #edf1f4;vertical-align:middle}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f7fbfb}.repo{font-weight:700}.sub{color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.teal{color:var(--teal);background:var(--teal-2)}.badge.amber{color:var(--amber);background:var(--amber-2)}.badge.red{color:var(--red);background:var(--red-2)}.badge.green{color:var(--green);background:var(--green-2)}.badge.gray{color:#627384;background:#edf1f4}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink)}.toolbar input{min-width:220px}.toolbar select{min-width:145px}.notice{border:1px solid #cbe8e5;background:#f0fbfa;color:#146661;border-radius:8px;padding:11px 13px;margin-bottom:16px}.notice.amber{border-color:#f0d59d;background:#fff9ed;color:#7a5200}.notice.red{border-color:#efc1bf;background:#fff3f2;color:#92312f}.mini-list{display:grid;gap:10px}.mini{border-bottom:1px solid #edf1f4;padding-bottom:10px}.mini:last-child{border:0;padding-bottom:0}.mini strong{display:block}.mini .sub{display:flex;justify-content:space-between;gap:10px}.bar{height:7px;background:#e9eef2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}.progress{margin-top:12px}.progress-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:16px}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px 16px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:650}.rail{display:flex;gap:4px;align-items:center;margin:18px 0}.step{flex:1;text-align:center;color:#718292;font-size:11px}.step i{display:block;height:7px;background:#dfe8ec;border-radius:8px;margin-bottom:6px}.step.done{color:var(--green)}.step.done i{background:var(--green)}.step.current{color:var(--teal);font-weight:700}.step.current i{background:var(--teal)}.gate{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #edf1f4}.gate:last-child{border-bottom:0}.gate b{display:block}.gate small{color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#10203075;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px #07131f55}.modal-head{display:flex;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:20px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:#f1f4f6;border-radius:50%;width:30px;height:30px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:transparent;padding:9px 0;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--teal);border-color:var(--teal);font-weight:700}.code{background:#182531;color:#d7e8ee;border-radius:8px;padding:14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.field{display:grid;gap:5px;margin-bottom:14px}.field label{font-weight:700}.field small{color:var(--muted)}.check{display:flex;gap:9px;align-items:flex-start;margin:10px 0}.check input{margin-top:4px;accent-color:var(--teal)}.empty{padding:26px;color:var(--muted);text-align:center}.footer-note{margin-top:20px;color:var(--muted);font-size:12px}.focus:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #66c7c1;outline-offset:2px}@media(max-width:980px){.app{grid-template-columns:74px 1fr}.sidebar{padding:18px 8px}.brand{padding:0 8px 22px}.brand strong,.sidebar .eyebrow,.nav button span:not(.icon),.scope{display:none}.nav button{justify-content:center;padding:11px}.topbar{padding:0 20px}.search{width:180px}.content{padding:22px 20px}.stats{grid-template-columns:repeat(3,1fr)}.cols,.detail-grid{grid-template-columns:1fr}}@media(max-width:620px){.app{display:block}.sidebar{display:none}.mobile-nav{display:block}.topbar{height:auto;padding:15px;align-items:flex-start;flex-direction:column}.top-actions{width:100%;flex-wrap:wrap}.search{flex:1;min-width:150px}.content{padding:18px 14px}.stats{grid-template-columns:repeat(2,1fr)}.view-head{display:block}.view-head .actions{margin-top:14px}.table{min-width:620px}.stat{padding:13px}.stat .number{font-size:23px}}
.mobile-nav{display:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">R</div><strong>Reforge</strong></div><div class="eyebrow" style="padding:0 12px 8px">Workspace</div><nav class="nav" id="nav"></nav><div class="scope"><span>Portfolio</span><b>Northstar Engineering</b><span>Prototype scope omits Campaigns, Runners, Usage and Audit.</span></div></aside>
<main class="main"><header class="topbar"><div class="top-title"><h1 id="pageTitle">Overview</h1><span class="synthetic">Design prototype • synthetic data</span></div><div class="top-actions"><select class="mobile-nav focus" id="mobileNav" aria-label="Navigate"><option value="overview">Overview</option><option value="repositories">Repositories</option><option value="findings">Findings</option><option value="runs">Runs</option><option value="changes">Changes</option><option value="deployments">Deployments</option><option value="policies">Policies</option><option value="connections">Connections</option></select><select class="org" aria-label="Organisation"><option>Northstar Engineering</option></select><input class="search focus" id="globalSearch" aria-label="Search repositories" placeholder="Search portfolio…"></div></header><div class="content" id="content"></div></main>
</div>
<div id="modalRoot"></div>
<script>
const repos=[
 {id:'atlas-api',name:'atlas-api',team:'Platform',forge:'GitHub',stack:'Go · Gin',bot:'Renovate',fresh:'12 min ago',work:'2',blocker:'None',status:'Monitored'},
 {id:'ledger-web',name:'ledger-web',team:'Payments',forge:'GitLab',stack:'TypeScript · pnpm',bot:'Renovate',fresh:'38 min ago',work:'4',blocker:'Native approval',status:'Monitored'},
 {id:'forge-runner',name:'forge-runner',team:'Infrastructure',forge:'Gitea',stack:'Go · Gin',bot:'Renovate',fresh:'2 hr ago',work:'1',blocker:'Capability unknown',status:'Monitored'},
 {id:'northstar-cli',name:'northstar-cli',team:'Developer Experience',forge:'GitHub',stack:'Go',bot:'Dependabot',fresh:'1 day ago',work:'0',blocker:'—',status:'Paused'}
];
const findings=[
 {id:'f-104',title:'Renovate update fails compatibility check',repo:'atlas-api',category:'Dependency',severity:'High',age:'18 min',owner:'Platform',state:'Needs decision',run:'run-221',change:'chg-81',evidence:'go test ./... fails after chi v5.0.12'},
 {id:'f-103',title:'Renovate MR has passed validation',repo:'ledger-web',category:'Dependency',severity:'Medium',age:'2 hr',owner:'Payments',state:'Ready',run:'run-219',change:'chg-79',evidence:'pnpm test and lint passed at 4f3a9c'},
 {id:'f-102',title:'Gitea branch protection capability unknown',repo:'forge-runner',category:'Policy',severity:'High',age:'3 hr',owner:'Infrastructure',state:'Blocked',run:'run-218',change:null,evidence:'Forge API did not expose required approval rule'},
 {id:'f-101',title:'Subscription model entitlement pending',repo:'atlas-api',category:'Connection',severity:'Medium',age:'5 hr',owner:'Platform',state:'Blocked',run:null,change:null,evidence:'Workspace model route awaits provider entitlement verification'}
];
const changes=[
 {id:'chg-81',repo:'atlas-api',forge:'GitHub',type:'PR',title:'chore(deps): update chi',owner:'Renovate',base:'main',head:'renovate/chi-5.x',risk:'Low',validation:'Passed',approval:'Approved',fresh:'Current',policy:'Allowed',status:'Eligible',sha:'a81d2f'},
 {id:'chg-79',repo:'ledger-web',forge:'GitLab',type:'MR',title:'chore(deps): update vitest',owner:'Renovate',base:'main',head:'renovate/npm-vitest-3.x',risk:'Low',validation:'Passed',approval:'Awaiting platform team',fresh:'Current',policy:'Allowed',status:'Blocked',sha:'4f3a9c'},
 {id:'chg-77',repo:'forge-runner',forge:'Gitea',type:'PR',title:'fix: retry registry timeout',owner:'Reforge',base:'main',head:'reforge/fix-registry-timeout',risk:'Medium',validation:'Passed',approval:'Unknown',fresh:'Stale',policy:'Cannot verify',status:'Blocked',sha:'0d81be'}
];
const runs=[
 {id:'run-221',recipe:'Repair dependency update',repo:'atlas-api',stage:'Validate',model:'Anthropic API',use:'$0.42',status:'Needs decision',detail:'Baseline reproduced; candidate validation passed after bounded repair.',executed:true,revision:'a81d2f',change:'chg-81',evidence:'revision=a81d2f\n$ go test ./...\nok   ./internal/api   1.82s\npolicy=allowed native_approval=approved\nresult=eligible'},
 {id:'run-219',recipe:'Repair dependency update',repo:'ledger-web',stage:'Publish',model:'Subscription · entitlement pending',use:'Unknown',status:'Paused',detail:'Native MR exists; Reforge will not duplicate bot work.',executed:false,revision:null,change:'chg-79',evidence:'paused=subscription entitlement pending\nno commands executed'},
 {id:'run-218',recipe:'Change eligibility probe',repo:'forge-runner',stage:'Discover',model:'Local endpoint',use:'Unknown · local compute unmetered',status:'Blocked',detail:'Gitea approval capability could not be verified.',executed:false,revision:null,change:'chg-77',evidence:'probe=stopped\nreason=target freshness and approval capability unknown\nno commands executed'}
];
let state={view:'overview',forge:'All',query:'',modal:null,policy:'Require native approval',simulated:'Baseline'};
const navItems=[['overview','Overview','⌂'],['repositories','Repositories','▦'],['findings','Findings','!'],['runs','Runs','◷'],['changes','Changes','⇄'],['deployments','Deployments','↗'],['policies','Policies','⚙'],['connections','Connections','◈']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(text,t='gray')=>`<span class="badge ${t}">${esc(text)}</span>`;
const typeFor=s=>/blocked|awaiting|unknown|pending|stale|exhausted/i.test(s)?'amber':/failed|cannot|error/i.test(s)?'red':/passed|approved|eligible|verified|current/i.test(s)?'green':'teal';
function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(([id,label,icon])=>`<button class="focus ${state.view===id?'active':''}" data-view="${id}" aria-label="${label}" aria-current="${state.view===id?'page':'false'}"><span class="icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('');const mobile=document.querySelector('#mobileNav');if(mobile)mobile.value=state.view}
function shell(title,sub,body,actions=''){document.querySelector('#pageTitle').textContent=title;document.querySelector('#content').innerHTML=`<div class="view-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>${body}`;renderNav();bindView();}
function stat(label,note,value,kind='teal'){return `<div class="stat ${kind}"><small>${label}</small><div class="number">${value}</div><small>${note}</small></div>`}
function overview(){const att=findings.slice(0,4);shell('Overview','A single queue from repository signal to verified delivery.',`<div class="grid stats">${stat('Needs decision','human or policy action','3','amber')}${stat('Running','active evidence jobs','1','teal')}${stat('Blocked','explicit reason required','4','red')}${stat('Ready for review','native checks current','1','green')}${stat('Verified deployments','last 7 days','6','green')}</div><div class="grid cols"><section class="card"><h3>Attention queue <span>4 items</span></h3><div class="table-wrap"><table class="table"><thead><tr><th>Reason</th><th>Repository</th><th>Age</th><th>Owner</th><th>Next action</th></tr></thead><tbody>${att.map(f=>`<tr data-finding="${f.id}"><td><b>${esc(f.title)}</b><div class="sub">${esc(f.category)} · ${esc(f.evidence)}</div></td><td>${esc(f.repo)}<div class="sub">${esc(repos.find(r=>r.id===f.repo).forge)}</div></td><td>${f.age}</td><td>${f.owner}</td><td>${badge(f.state,typeFor(f.state))}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>Capacity & spend <span>Window: Sep 20</span></h3><div class="kv"><dt>Queued jobs</dt><dd>7</dd><dt>Busy runners</dt><dd>2 / 4</dd><dt>API budget</dt><dd>$12.18 / $20.00</dd><dt>Campaign budget</dt><dd>${badge('Exhausted','red')}</dd><dt>Subscription</dt><dd>${badge('Entitlement pending','amber')}</dd><dt>Paused reason</dt><dd>Budget exhaustion; no fallback</dd></div><div class="progress"><div class="progress-line"><span>Reserved capacity</span><b>61%</b></div><div class="bar"><i style="width:61%"></i></div></div></section></div><section class="card" style="margin-top:16px"><h3>Portfolio <span>4 repositories · 3 forges</span></h3><div class="table-wrap"><table class="table"><thead><tr><th>Repository</th><th>Forge</th><th>Stack</th><th>Bot manager</th><th>Last validation</th><th>Open work</th><th>Blocker</th></tr></thead><tbody>${repos.map(r=>`<tr data-repo="${r.id}"><td><span class="repo">${r.name}</span><div class="sub">${r.team}</div></td><td>${r.forge}</td><td>${r.stack}</td><td>${r.bot}</td><td>${r.fresh}</td><td>${r.work}</td><td>${badge(r.blocker,r.blocker==='None'?'green':typeFor(r.blocker))}</td></tr>`).join('')}</tbody></table></div></section>`)}
function repoRows(){return repos.filter(r=>(state.forge==='All'||r.forge===state.forge)&&(`${r.name} ${r.team} ${r.stack}`.toLowerCase().includes(state.query.toLowerCase())))}
function repositories(){const rows=repoRows();shell('Repositories','Search a multi-forge inventory without hiding stale or unsupported capabilities.',`<div class="notice">Bot adoption is visible per repository. Existing Renovate and Dependabot work remains authoritative; Reforge proposes cooperation instead of duplicate updates.</div><div class="toolbar"><input class="focus" id="repoSearch" value="${esc(state.query)}" placeholder="Search repository or team"><select class="focus" id="forgeFilter" aria-label="Forge filter"><option>All</option><option ${state.forge==='GitHub'?'selected':''}>GitHub</option><option ${state.forge==='GitLab'?'selected':''}>GitLab</option><option ${state.forge==='Gitea'?'selected':''}>Gitea</option></select><button class="btn primary" data-action="toast" data-message="Simulation only: import wizard is not connected.">Import repositories</button></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Repository</th><th>Forge / instance</th><th>Stack</th><th>Policy</th><th>Bot manager</th><th>Freshness</th><th>Open work</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr data-repo="${r.id}"><td><span class="repo">${r.name}</span><div class="sub">${r.team}</div></td><td>${r.forge}<div class="sub">${r.forge==='Gitea'?'gitea.internal':'cloud'}</div></td><td>${r.stack}</td><td>${badge(r.status,r.status==='Paused'?'amber':'green')}</td><td>${r.bot}</td><td>${r.fresh}</td><td>${r.work?badge(`${r.work} open`, 'amber'):badge('Clear','green')}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">No repositories match this view.</td></tr>`}</tbody></table></div></section>`)}
function findingsView(){shell('Findings','One inbox for bot work, deterministic checks, CI and policy evidence. Click a finding to inspect its proof.',`<div class="toolbar"><select class="focus" disabled title="Preview only: state filter is unavailable"><option>All states · unavailable</option></select><select class="focus" disabled title="Preview only: category filter is unavailable"><option>All categories · unavailable</option></select><button class="btn" data-action="toast" data-message="Simulation only: bulk queue preview opened.">Preview bulk queue</button></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Finding</th><th>Source</th><th>Severity</th><th>Repository</th><th>Evidence age</th><th>Next action</th></tr></thead><tbody>${findings.map(f=>`<tr data-finding="${f.id}"><td><b>${esc(f.title)}</b><div class="sub">${esc(f.evidence)}</div></td><td>${f.category==='Dependency'?repos.find(r=>r.id===f.repo).bot:'Reforge probe'}</td><td>${badge(f.severity,f.severity==='High'?'red':'amber')}</td><td>${f.repo}</td><td>${f.age}</td><td>${badge(f.state,typeFor(f.state))}</td></tr>`).join('')}</tbody></table></div></section>`)}
function runsView(){shell('Runs','Bounded evidence jobs; waiting for a reviewer is a change state, not an active repair.',`<div class="notice amber">One run is paused because the subscription entitlement is pending. No paid fallback is selected automatically.</div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Run</th><th>Recipe</th><th>Repository</th><th>Stage</th><th>Model route</th><th>Use</th><th>Status</th></tr></thead><tbody>${runs.map(r=>`<tr data-run="${r.id}"><td><b>${r.id}</b><div class="sub">Owner: Reforge</div></td><td>${r.recipe}</td><td>${r.repo}</td><td>${r.stage}</td><td>${r.model}</td><td>${r.use}</td><td>${badge(r.status,typeFor(r.status))}</td></tr>`).join('')}</tbody></table></div></section><div class="grid cols" style="margin-top:16px"><section class="card"><h3>Evidence rail</h3><div class="rail"><div class="step done"><i></i>Discover</div><div class="step done"><i></i>Reproduce</div><div class="step done"><i></i>Plan</div><div class="step done"><i></i>Repair</div><div class="step current"><i></i>Validate</div><div class="step"><i></i>Publish</div></div><p class="sub">Select a run to view its pinned revision, bounded logs, checks and candidate diff.</p></section><section class="card"><h3>Usage guardrails</h3><div class="kv"><dt>Organisation cap</dt><dd>$20.00 / window</dd><dt>Consumed</dt><dd>$12.18</dd><dt>Reserved</dt><dd>$4.90</dd><dt>Exhaustion action</dt><dd>Pause and explain</dd></div></section></div>`)}
function changesView(){shell('Changes','PRs and MRs retain native ownership while Reforge explains whether the next action is eligible.',`<div class="notice">Native approval is separate from application approval. Unknown protection is a blocker, even when validation passed.</div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Change</th><th>Owner</th><th>Target</th><th>Validation</th><th>Native review</th><th>Policy</th><th>Eligibility</th></tr></thead><tbody>${changes.map(c=>`<tr data-change="${c.id}"><td><b>${c.type} · ${esc(c.title)}</b><div class="sub">${c.repo} · ${c.sha}</div></td><td>${c.owner}</td><td>${c.base}</td><td>${badge(c.validation,'green')}</td><td>${badge(c.approval,c.approval==='Approved'?'green':c.approval==='Unknown'?'amber':'amber')}</td><td>${c.policy}</td><td>${badge(c.status,c.status==='Eligible'?'green':'amber')}</td></tr>`).join('')}</tbody></table></div></section>`)}
function deploymentsView(){shell('Deployments','Delivery evidence follows a merged SHA; pipeline success is separate from application health.',`<div class="grid cols"><section class="card"><h3>Recent delivery</h3><div class="mini-list"><div class="mini"><strong>atlas-api · staging</strong><div class="sub"><span>77d9c1 · merged change chg-64 · build 1842</span>${badge('Verified','green')}</div></div><div class="mini"><strong>ledger-web · production</strong><div class="sub"><span>2c14a8 · previous merge chg-72 · current MR 4f3a9c pending</span>${badge('Waiting','amber')}</div></div><div class="mini"><strong>forge-runner · staging</strong><div class="sub"><span>6e0a2d · previous merge · current PR 0d81be blocked</span>${badge('Blocked','amber')}</div></div></div></section><section class="card"><h3>Delivery controls</h3><div class="kv"><dt>Allowlisted workflows</dt><dd>3</dd><dt>Native approvals</dt><dd>2 pending</dd><dt>Verified this week</dt><dd>6</dd><dt>Recovery</dt><dd>GitOps revert only</dd></div><button class="btn" style="margin-top:16px" data-action="toast" data-message="Simulation only: deployment request requires an eligible change.">Request deployment</button></section></div><section class="card" style="margin-top:16px"><h3>Timeline · atlas-api</h3><div class="gate"><div><b>Merge request</b><small>Native GitHub checks and approval complete · merged change chg-64 at 77d9c1</small></div>${badge('Verified','green')}</div><div class="gate"><div><b>Staging pipeline</b><small>Build artifact sha256:91b8… · workflow #1842 · deployed 77d9c1</small></div>${badge('Completed','green')}</div><div class="gate"><div><b>Application health</b><small>Smoke and endpoint checks observed for 14 minutes</small></div>${badge('Verified','green')}</div></section>`)}
function policiesView(){shell('Policies','Versioned rules decide what Reforge may propose, merge or deliver.',`<div class="grid detail-grid"><section class="card"><h3>Simulation</h3><div class="field"><label for="policyRule">Change rule</label><select id="policyRule" class="focus"><option>Require native approval</option><option>Permit low-risk patch merge</option><option>Require application approval</option><option>Block deployment to production</option></select><small>Simulation uses stored synthetic evidence; it does not call a forge or mutate a provider.</small></div><label class="check"><input id="botCooperate" type="checkbox" checked> <span><b>Cooperate with existing bot work</b><small class="sub">Adopt Renovate/Dependabot changes instead of opening duplicates.</small></span></label><button class="btn primary" data-action="simulate-policy">Simulate against changes</button><div id="policyResult" style="margin-top:16px"></div></section><section class="card"><h3>Effective policy · Platform</h3><div class="kv"><dt>Preset</dt><dd>Propose fixes</dd><dt>Merge route</dt><dd>Native enforcement</dd><dt>Deploy route</dt><dd>Approved staging workflow</dd><dt>Write limits</dt><dd>1 task / branch · 3 open changes</dd><dt>Model spend</dt><dd>$20 window</dd></div><p class="footer-note">More permissive presets require policy-admin role and an audit reason.</p></section></div><section class="card" style="margin-top:16px"><h3>Policy versions</h3><div class="table-wrap"><table class="table"><thead><tr><th>Version</th><th>Scope</th><th>Changed by</th><th>Effect</th><th>Status</th></tr></thead><tbody><tr><td>v18</td><td>Northstar / Platform</td><td>R. Chen · 2 hr ago</td><td>Adopt Renovate; native review required</td><td>${badge('Current','green')}</td></tr><tr><td>v17</td><td>Northstar / All teams</td><td>A. Patel · Sep 18</td><td>API budget pause at 80%</td><td>${badge('Superseded','gray')}</td></tr></tbody></table></div></section>`)}
function connectionsView(){shell('Connections','Forge, model and delivery connections show verified scope and entitlement separately.',`<div class="grid cols"><section class="card"><h3>Forges</h3><div class="mini-list"><div class="mini"><strong>GitHub Cloud</strong><div class="sub"><span>Northstar · 2 repos · PR read/write</span>${badge('Verified','green')}</div></div><div class="mini"><strong>GitLab Cloud</strong><div class="sub"><span>Payments · 1 repo · MR read/write</span>${badge('Verified','green')}</div></div><div class="mini"><strong>Gitea internal</strong><div class="sub"><span>Infrastructure · capability probe incomplete</span>${badge('Partial','amber')}</div></div></div></section><section class="card"><h3>Models & agents</h3><div class="mini-list"><div class="mini"><strong>Anthropic API</strong><div class="sub"><span>Repair · Platform · API billing</span>${badge('Verified','green')}</div></div><div class="mini"><strong>Northstar subscription</strong><div class="sub"><span>Repair · entitlement check pending</span>${badge('Pending','amber')}</div></div><div class="mini"><strong>Local compatible endpoint</strong><div class="sub"><span>Gitea runner · usage unknown; local compute unmetered</span>${badge('Unmetered','gray')}</div></div></div></section></div><section class="card" style="margin-top:16px"><h3>Delivery integrations</h3><div class="notice amber">No cluster-admin access is represented here. Deployment requests resolve to allowlisted workflows or GitOps changes.</div><button class="btn" data-action="toast" data-message="Simulation only: connection test queued.">Test selected connections</button><p class="footer-note">Credentials are write-only in the product; this prototype stores none.</p></section>`)}
function render(){({overview,repositories,findings:findingsView,runs:runsView,changes:changesView,deployments:deploymentsView,policies:policiesView,connections:connectionsView}[state.view]||overview)()}
function openModal(kind,id){const trigger=state.modal?.trigger||document.activeElement;state.modal={kind,id,trigger};const title=kind==='finding'?'Finding detail':kind==='run'?'Run evidence':'Change eligibility';document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="eyebrow">Synthetic ${kind}</span><h2 id="modalTitle">${title}</h2></div><button class="close focus" id="closeModal" aria-label="Close dialog">×</button></div><div class="modal-body">${modalBody(kind,id)}</div><div class="modal-foot"><button class="btn" id="closeBottom">Close</button></div></section></div>`;document.querySelector('#closeModal').focus();document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#closeBottom').onclick=closeModal;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};bindModalActions();document.addEventListener('keydown',modalKey)}
function modalBody(kind,id){if(kind==='finding'){const f=findings.find(x=>x.id===id);const blocked=f.state==='Blocked';return `<div class="tabs" aria-label="Finding sections"><button class="active">Summary</button><button disabled>Evidence (preview)</button><button disabled>Activity (preview)</button></div><div class="notice ${typeFor(f.state)}">${badge(f.state,typeFor(f.state))} <b>${esc(f.title)}</b></div><dl class="kv"><dt>Repository</dt><dd>${f.repo} · ${repos.find(r=>r.id===f.repo).forge}</dd><dt>Source</dt><dd>${f.category==='Dependency'?repos.find(r=>r.id===f.repo).bot:'Reforge capability probe'}</dd><dt>Evidence</dt><dd>${esc(f.evidence)}</dd><dt>Owner</dt><dd>${f.owner}</dd><dt>Action</dt><dd>${blocked?'Resolve capability or entitlement blocker':'Review bounded evidence'}</dd></dl><div class="actions" style="margin-top:20px">${f.run?`<button class="btn primary" data-modal-route="run" data-id="${f.run}">Open run evidence</button>`:''}${f.change?`<button class="btn" data-modal-route="change" data-id="${f.change}">Review resulting change</button>`:''}<button class="btn" ${blocked?'disabled title="Blocked finding cannot be queued"':''} data-action="toast" data-message="Simulation only: finding queued with current policy.">${blocked?'Queue repair blocked':'Queue repair'}</button></div>`}if(kind==='run'){const r=runs.find(x=>x.id===id);const evidence=r.executed?`<h3 style="margin-top:20px">Bounded evidence</h3><div class="code">${esc(r.evidence)}</div>`:`<div class="notice amber"><b>No execution evidence recorded.</b> ${esc(r.detail)} Commands and validation results are unavailable for this run.</div><h3 style="margin-top:20px">Run record</h3><div class="code">${esc(r.evidence)}</div>`;return `<div class="notice">${badge(r.status,typeFor(r.status))} <b>${r.recipe}</b></div><div class="rail"><div class="step ${r.executed?'done':'current'}"><i></i>Discover</div><div class="step ${r.executed?'done':''}"><i></i>Reproduce</div><div class="step ${r.executed?'done':''}"><i></i>Plan</div><div class="step ${r.executed?'done':''}"><i></i>Repair</div><div class="step ${r.executed?'current':''}"><i></i>Validate</div><div class="step"><i></i>Publish</div></div><dl class="kv"><dt>Run</dt><dd>${r.id}</dd><dt>Repository</dt><dd>${r.repo}</dd><dt>Model route</dt><dd>${r.model}</dd><dt>Use</dt><dd>${r.use}</dd><dt>Outcome</dt><dd>${r.detail}</dd></dl>${evidence}<div class="actions" style="margin-top:16px">${r.change?`<button class="btn primary" data-modal-route="change" data-id="${r.change}">${r.executed?'Review change eligibility':'Inspect linked change'}</button>`:''}</div>`}const c=changes.find(x=>x.id===id);const blocked=c.status!=='Eligible';const ownership=c.owner==='Reforge'?'(Reforge-generated change)':'(native bot retained)';return `<div class="notice ${blocked?'amber':'green'}">${badge(c.status,blocked?'amber':'green')} <b>${c.type} · ${esc(c.title)}</b></div><div class="detail-grid"><div><dl class="kv"><dt>Repository</dt><dd>${c.repo} · ${c.forge}</dd><dt>Owner</dt><dd>${c.owner} <span class="sub">${ownership}</span></dd><dt>Target</dt><dd>${c.base}</dd><dt>Head</dt><dd>${c.head} · ${c.sha}</dd></dl><h3 style="margin-top:20px">Validation evidence</h3><div class="code">candidate=${c.sha}\nvalidation=${c.validation.toLowerCase()}\npolicy=${c.policy.toLowerCase()}\nmerge_route=native ${c.forge}</div></div><div class="card" style="box-shadow:none"><h3>Eligibility</h3><div class="gate"><div><b>Candidate validation</b><small>Passed at ${c.sha}</small></div>${badge(c.validation,'green')}</div><div class="gate"><div><b>Native approval</b><small>${c.approval==='Approved'?'Code owner approval recorded':'Required approval is missing or unknown'}</small></div>${badge(c.approval,typeFor(c.approval))}</div><div class="gate"><div><b>Target freshness</b><small>${c.fresh==='Current'?'Target ref is current':'Target ref is stale; refresh required before merge'}</small></div>${badge(c.fresh,typeFor(c.fresh))}</div><div class="gate"><div><b>Policy</b><small>${c.policy==='Allowed'?'Low risk; paths within allowance':'Cannot verify protection'}</small></div>${badge(c.policy,typeFor(c.policy))}</div></div></div><div class="actions" style="margin-top:20px"><button class="btn" data-action="toast" data-message="Simulation only: native review opened in a new tab.">Open native review</button><button class="btn primary" ${blocked?'disabled':''} data-action="native-merge" data-id="${c.id}">${blocked?'Merge blocked — approval required':'Request native merge'}</button>${!blocked?`<button class="btn" data-modal-route="deployment" data-id="${c.id}">View deployment</button>`:''}</div>`}
function closeModal(){const trigger=state.modal&&state.modal.trigger;state.modal=null;document.querySelector('#modalRoot').innerHTML='';document.removeEventListener('keydown',modalKey);if(trigger&&trigger.isConnected)trigger.focus()}
function modalKey(e){if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const box=document.querySelector('.modal');if(!box)return;const els=[...box.querySelectorAll('button,input,select,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
function toast(message){const n=document.createElement('div');n.className='notice';n.style.cssText='position:fixed;right:22px;bottom:22px;z-index:8;box-shadow:var(--shadow)';n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function policySimulation(){const rule=document.querySelector('#policyRule').value;state.simulated=rule;const eligible=rule==='Permit low-risk patch merge';document.querySelector('#policyResult').innerHTML=`<div class="notice ${eligible?'':'amber'}">${badge(eligible?'Eligible under simulation':'Blocked under simulation',eligible?'green':'amber')} <b>${eligible?'atlas-api PR can request native merge.':'Native approval or policy gate remains required.'}</b><div class="sub" style="margin-top:5px">Stored evidence is unchanged; this is a preview of the policy decision.</div></div>`;toast('Simulation updated; no provider was changed.')}
function bindActions(scope=document){scope.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='toast')toast(b.dataset.message);if(b.dataset.action==='simulate-policy')policySimulation();if(b.dataset.action==='native-merge')toast('Simulation only: native merge requested because all gates passed.')})}
function bindRoutes(scope=document){scope.querySelectorAll('[data-modal-route]').forEach(b=>b.onclick=()=>{if(b.dataset.modalRoute==='deployment'){closeModal();state.view='deployments';render();return}openModal(b.dataset.modalRoute,b.dataset.id)})}
function bindModalActions(){const modal=document.querySelector('.modal');if(modal){bindActions(modal);bindRoutes(modal)}}
function bindView(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.query='';render()});const mobile=document.querySelector('#mobileNav');if(mobile)mobile.onchange=e=>{state.view=e.target.value;state.query='';render()};const activate=(x,fn)=>{x.tabIndex=0;x.onclick=fn;x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}};document.querySelectorAll('[data-finding]').forEach(x=>activate(x,()=>openModal('finding',x.dataset.finding)));document.querySelectorAll('[data-run]').forEach(x=>activate(x,()=>openModal('run',x.dataset.run)));document.querySelectorAll('[data-change]').forEach(x=>activate(x,()=>openModal('change',x.dataset.change)));document.querySelectorAll('[data-repo]').forEach(x=>activate(x,()=>{state.view='repositories';state.query=x.dataset.repo;render()}));const rs=document.querySelector('#repoSearch');if(rs){rs.oninput=e=>{const start=e.target.selectionStart,end=e.target.selectionEnd;state.query=e.target.value;repositories();const next=document.querySelector('#repoSearch');if(next){next.focus();next.setSelectionRange(start,end)}};document.querySelector('#forgeFilter').onchange=e=>{state.forge=e.target.value;repositories()}}bindActions();bindRoutes();if(document.querySelector('#policyRule'))document.querySelector('#policyRule').value=state.simulated==='Baseline'?'Require native approval':state.simulated}
document.querySelector('#globalSearch').oninput=e=>{state.query=e.target.value;state.view='repositories';render()};render();
</script>
</body>
</html>
