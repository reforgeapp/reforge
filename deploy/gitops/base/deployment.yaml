apiVersion: apps/v1
kind: Deployment
metadata:
  name: reforge-control
  labels:
    app.kubernetes.io/name: reforge-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reforge-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reforge-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: reforge-artifacts
      containers:
        - name: control
          image: reforge-control:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: reforge-config
            - secretRef:
                name: reforge-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /app/var/artifacts
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
