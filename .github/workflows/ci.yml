name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Release version fixtures
        run: python3 scripts/test-release-version.py

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt

  images:
    needs: [lint, vulnerabilities, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reforge
            dockerfile: deploy/control/Dockerfile
            context: .
          - image: reforge-runner
            dockerfile: deploy/runner/Dockerfile
            context: .
          - image: reforge-workspace-go
            dockerfile: deploy/runner/Dockerfile
            context: .
            target: workspace-go
          - image: reforge-workspace-javascript
            dockerfile: deploy/runner/Dockerfile
            context: .
            target: workspace-javascript
          - image: reforge-workspace-python
            dockerfile: deploy/runner/Dockerfile
            context: .
            target: workspace-python
          - image: reforge-docs
            dockerfile: deploy/docs/Dockerfile
            context: deploy/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.release-version }},enable=${{ inputs.release-version != '' }},priority=1000
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: /app/gvisor
          exit-code: "1"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.release-version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.release-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq '.[].ref')"
          while IFS= read -r ref; do
            if [ "$ref" = "refs/tags/v$RELEASE_VERSION" ]; then
              echo "Release v$RELEASE_VERSION already tagged; preserving published images"
              exit 0
            fi
          done <<< "$refs"
          while IFS= read -r tag; do
            docker tag "$IMAGE_NAME:scan" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
